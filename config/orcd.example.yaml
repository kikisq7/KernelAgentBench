# Copy to config/orcd.yaml and fill values marked REQUIRED.
# H200 job request (sbatch by default; same flags as a manual salloc):
#   1 node, 1 CPU, 8GB, 00:20:00, h200:1, mit_normal_gpu
partition: mit_normal_gpu
gpu_request: h200:1
nodes: 1
ntasks: 1
cpus_per_task: 1
memory: 8GB
wall_time: "00:20:00"

# Optional Slurm account/QoS. Leave empty if your default account can take H200s.
account: ""
qos: ""
reservation: ""
email: ""
scratch_root: "REQUIRED"

# SSH uses ControlMaster so one Duo/Kerberos login is reused by rsync.
# From a terminal: kernel-agent-bench ssh-check --orcd config/orcd.yaml
# Then start. identity_file is only needed if the key is not the default.
# remote_project must be the absolute KernelAgentBench directory. Rsync only
# writes candidates/<id>/ and reads results/<id>.json. It does not --delete
# or sync the rest of the clone.
ssh_host: "orcd-login.mit.edu"
ssh_user: "REQUIRED"
ssh_port: 22
identity_file: ""
remote_project: "REQUIRED"
auto_evaluate: true
# If you already hold an salloc, set the job id and each eval uses srun only.
salloc_job_id: ""

setup_commands:
  - module purge
  - module load julia
  - module load cuda
  # - module load python
  # - source /path/to/UROPJulia/KernelAgentBench/.venv/bin/activate

container_image: ""
