study_id: gray-scott-julia-backends-v2
task_version: gray-scott-2d-five-point-v1
seed: 20260918
replicates: 3
trace_content: true

# Exact pins: discovery fails loudly instead of falling back to another model.
models:
  - alias: opus-5.5
    match: "^claude-opus-5-5$"
    newest: true
  - alias: gpt-6-astra
    match: "^gpt-6-astra$"
    newest: true
  - alias: composer-2.5
    match: "^composer-2\\.5$"
    newest: true

# Julia-only study. Agents still run the existing optimize → test → eval loop.
# KernelAbstractions is the focus track (CPU + NVIDIA now; AMD/ROCm later).
languages:
  - id: julia-ka
    backend: ka
    requires_gpu: true
    evaluate_locally: false
    editable_paths:
      - kernels/gray_scott/ka/candidate.jl
    workspace_paths:
      - kernels/gray_scott/reference.jl
      - kernels/gray_scott/ka
      - julia
      - prompts/optimize_gray_scott_ka.md
    public_test_command: >-
      julia --project=julia julia/test/runtests.jl ka
    prompt_path: prompts/optimize_gray_scott_ka.md
  - id: julia-cuda
    backend: cuda
    requires_gpu: true
    evaluate_locally: false
    editable_paths:
      - kernels/gray_scott/cuda/candidate.jl
    workspace_paths:
      - kernels/gray_scott/reference.jl
      - kernels/gray_scott/cuda
      - julia
      - prompts/optimize_gray_scott_cuda.md
    public_test_command: >-
      julia --project=julia julia/test/runtests.jl cuda
    prompt_path: prompts/optimize_gray_scott_cuda.md
  - id: julia-cpu
    backend: cpu
    requires_gpu: false
    evaluate_locally: true
    editable_paths:
      - kernels/gray_scott/cpu/candidate.jl
    workspace_paths:
      - kernels/gray_scott/reference.jl
      - kernels/gray_scott/cpu
      - julia
      - prompts/optimize_gray_scott_cpu.md
    public_test_command: >-
      julia --project=julia julia/test/runtests.jl cpu
    prompt_path: prompts/optimize_gray_scott_cpu.md
    evaluation:
      dtype: Float32
      correctness_shapes:
        - [31, 29]
        - [64, 64]
        - [127, 65]
      performance_shapes:
        - [256, 256]
        - [512, 512]
        - [1024, 1024]
      steps: 200
      warmups: 1
      repetitions: 5
      atol: 0.00002
      rtol: 0.0002
      max_regression_fraction: 0.03
      min_relative_improvement: 0.05
      correctness_dtypes: [Float32, Float64]
      float64_atol: 1.0e-12
      float64_rtol: 1.0e-10

budgets:
  max_agent_iterations: 5
  max_h200_evaluations: 5
  max_total_tokens: 200000
  max_wall_seconds: 21600

evaluation:
  dtype: Float32
  correctness_shapes:
    - [31, 29]
    - [64, 64]
    - [127, 65]
  performance_shapes:
    - [1024, 1024]
    - [2048, 2048]
    - [4096, 4096]
  steps: 1000
  warmups: 3
  repetitions: 10
  atol: 0.00002
  rtol: 0.0002
  max_regression_fraction: 0.03
  min_relative_improvement: 0.05
  # Correctness gate runs in both precisions; timing stays on `dtype`.
  # atol/rtol above apply to Float32.
  correctness_dtypes: [Float32, Float64]
  float64_atol: 1.0e-12
  float64_rtol: 1.0e-10
